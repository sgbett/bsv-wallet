# What `rake docs:references` checks (CI job "Docs guards"): every class,
# module, method, bin/ executable, file path and migration number that a doc
# names in inline code must exist. Inside an unlabelled fence (a diagram),
# qualified names such as Engine::Hydrator are checked too.
#
# `allow` lists references a doc makes on purpose to something that doesn't
# exist, each with the reason. An entry that starts to resolve, or that no doc
# mentions any more, fails the check until it's removed.

scan:
  - docs
  - CLAUDE.md
  - .github/copilot-instructions.md

skip:
  - docs/_site
  - docs/vendor
  - docs/.bundle
  - docs/reference/api        # generated by YARD
  - docs/reference/external   # vendored upstream specs

allow:
  bin/brc100: the proposed BRC-100 CLI (#431)
  Namespace::Class: a placeholder in CLAUDE.md's naming convention
  foo.md: a placeholder in about-these-docs.md
  docs/concepts/X.md: a placeholder in about-these-docs.md
  docs/reference/X.md: a placeholder in about-these-docs.md
  manifest.json: a BRC-100 app's manifest, not a file in this repository
