# Retired vocabulary, enforced by `rake docs:retired_terms` (CI job "Docs guards").
#
# The canonical list is the "Retired terms" table in docs/reference/glossary.md.
# Every row there needs either a term here that names it in `row:`, or an entry
# under `manual:` for rows no pattern can tell apart from legitimate uses, which
# review catches instead (.github/copilot-instructions.md). Terms without a
# `row:` enforce removals the glossary doesn't list, such as deleted binaries.
#
# Patterns are case-insensitive Ruby regular expressions. `exempt` lists files
# where the term is legitimate. An entry with `pending: '#N'` is reported but
# doesn't fail the build; once it has no hits left the check fails until the
# `pending:` key is deleted, so the term goes live when issue #N lands.

scan:
  - docs
  - gem/bsv-wallet/lib
  - gem/bsv-wallet/bin
  - CLAUDE.md
  - .github/copilot-instructions.md

skip:
  - docs/_site
  - docs/vendor
  - docs/.bundle
  - docs/reference/api        # generated by YARD from lib/, which is scanned
  - docs/reference/external   # vendored upstream specs

# Sections that name retired terms in order to retire them.
exempt_sections:
  - path: docs/reference/glossary.md
    heading: Retired terms
  - path: CLAUDE.md
    heading: Vocabulary

# Glossary rows no pattern can tell apart from the term's legitimate uses.
manual:
  - staged, for outputs or caller metadata written before promotion
  - import, for an incoming transaction
  - primitive, porcelain (unqualified)

terms:
  - retired: substrate
    row: substrate
    pattern: '\bsubstrates?\b'
    use_instead: the Hydrator, the HydratedTxCache or core's domain model, whichever is meant

  - retired: caller-delivered, deferred-by-caller
    row: caller-delivered, deferred-by-caller
    pattern: '\b(caller-delivered|deferred-by-caller)\b'
    use_instead: transmit intent `none`

  - retired: deferred broadcast
    row: 'deferred broadcast; `async` as a broadcast mode, including `--broadcast=async`'
    pattern: '\bdeferred[ -]broadcasts?\b'
    use_instead: broadcast intent `delayed`

  - retired: '--broadcast=async'
    row: 'deferred broadcast; `async` as a broadcast mode, including `--broadcast=async`'
    pattern: '--broadcast=[a-z|]*\basync\b'
    use_instead: '--broadcast=delayed'

  - retired: BRC-100 primitive
    row: BRC-100 primitive
    pattern: '\bBRC-100 primitives?\b'
    use_instead: BRC-100 method

  - retired: bin/create, bin/send, bin/receive (removed in 476458c)
    pattern: '\bbin/(create|send|receive)\b'
    use_instead: bin/wallet send, bin/wallet receive

  # BRC-100's call-shape options stay legal in the conformance layer, which
  # keeps the spec's own names and translates them (#548).
  # The CLI keeps its `--no-send` flag, and the option key mirrors the flag.
  - retired: no_send
    row: '`no_send:` / `accept_delayed_broadcast:` on an Engine method'
    pattern: '\bno_send\b'
    use_instead: '`broadcast_intent: :none`'
    exempt:
      - gem/bsv-wallet/lib/bsv/wallet/brc100.rb
      - docs/reference/brc100-conformance.md
      - gem/bsv-wallet/lib/bsv/wallet/cli/commands/consolidate.rb
      - gem/bsv-wallet/lib/bsv/wallet/cli/commands/import.rb
      - gem/bsv-wallet/lib/bsv/wallet/cli/commands/sweep.rb

  - retired: accept_delayed_broadcast
    row: '`no_send:` / `accept_delayed_broadcast:` on an Engine method'
    pattern: '\baccept_delayed_broadcast\b'
    use_instead: '`broadcast_intent: :delayed`'
    exempt: [gem/bsv-wallet/lib/bsv/wallet/brc100.rb, docs/reference/brc100-conformance.md]

  - retired: sign_and_process
    row: '`sign_and_process:` on an Engine method'
    pattern: '\bsign_and_process\b'
    use_instead: '`defer_signing:`'
    exempt: [gem/bsv-wallet/lib/bsv/wallet/brc100.rb, docs/reference/brc100-conformance.md]

  - retired: randomize_outputs, "randomize" for output order
    row: '`randomize_outputs:`; "randomize" for output order'
    pattern: '\brandomize_outputs\b|\brandomi[sz](?:e|es|ed|ing)\b(?:\W+\w+){0,3}?\W+outputs?\b|\boutputs?\b(?:\W+\w+){0,3}?\W+randomi[sz](?:e|es|ed|ing)\b'
    use_instead: '`shuffle_outputs:`; shuffle'
    exempt: [gem/bsv-wallet/lib/bsv/wallet/brc100.rb, docs/reference/brc100-conformance.md]
